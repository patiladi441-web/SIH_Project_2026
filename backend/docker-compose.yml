# ── Shared environment for backend + celery ───────────────────────────────────
x-backend-env: &backend-env
  DB_URL: postgresql+asyncpg://oceanembed:secret@postgres:5432/oceanembed
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  AI_ENGINE_URL: mock
  GRID_RESOLUTION: "0.25"
  DEPTH_LEVELS: "[0,10,20,50,100,200,500,1000,1500,2000]"
  CACHE_TTL_SECONDS: "3600"
  APP_ENV: development
  LOG_LEVEL: INFO

services:

  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: oceanembed_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oceanembed
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: oceanembed
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanembed -d oceanembed"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oceanembed_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: oceanembed_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./data:/app/data        # persist downloaded NetCDF files
      - .:/app                  # hot-reload in dev (remove in prod)
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_regions.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: oceanembed_celery
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./data:/app/data
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping || exit 0"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── AI Engine Placeholder ──────────────────────────────────────────────────
  # Uncomment when Kaushik/Adinath's model Docker image is ready.
  # Update AI_ENGINE_URL to http://ai-engine:8001 in backend env above.
  #
  # ai-engine:
  #   image: <ai-team-registry>/oceanembed-model:latest
  #   container_name: oceanembed_ai
  #   restart: unless-stopped
  #   ports:
  #     - "8001:8001"

volumes:
  postgres_data:
  redis_data:
